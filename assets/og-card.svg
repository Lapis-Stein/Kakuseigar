<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kakuseigar — 青娥の小説案内</title>
  <desc id="desc">次に読む一篇を、あなたに。青娥と少しお話しして、好みに合いそうな物語を見つける小説案内。</desc>
  <rect width="1200" height="630" fill="#f7f4ed"/>
  <path d="M0 0h1200v8H0Z" fill="#275c5a"/>
  <path d="M76 112h1048M76 544h1048" stroke="#d4dbd1"/>
  <rect x="77" y="44" width="40" height="44" fill="none" stroke="#275c5a"/>
  <text x="97" y="75" fill="#275c5a" font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="29" text-anchor="middle">青</text>
  <text x="135" y="75" fill="#263b3b" font-family="Georgia, serif" font-size="27" letter-spacing="1">Kakuseigar</text>
  <text x="1124" y="73" fill="#667372" font-family="Yu Gothic, Meiryo, sans-serif" font-size="15" text-anchor="end" letter-spacing="2">青娥の小説案内</text>
  <circle cx="288" cy="322" r="134" fill="#e6ece2" stroke="#c5d2c3"/>
  <rect x="207" y="242" width="190" height="190" fill="none" stroke="#bacdbd" transform="rotate(23 302 337)"/>
  <text x="288" y="354" fill="#275c5a" font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="106" text-anchor="middle">青</text>
  <path d="M496 200h32" stroke="#275c5a"/>
  <text x="542" y="205" fill="#275c5a" font-family="Yu Gothic, Meiryo, sans-serif" font-size="15" letter-spacing="4">物語との出会いを、少しの問答から。</text>
  <text x="496" y="301" fill="#263b3b" font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="61" letter-spacing="4">次に読む一篇を、</text>
  <text x="496" y="390" fill="#263b3b" font-family="Yu Mincho, Hiragino Mincho ProN, serif" font-size="61" letter-spacing="4">あなたに。</text>
  <text x="498" y="462" fill="#667372" font-family="Yu Gothic, Meiryo, sans-serif" font-size="19" letter-spacing="1">青娥と少しお話ししてみませんか。</text>
  <text x="77" y="583" fill="#7a877e" font-family="Georgia, serif" font-size="13" letter-spacing="3">SEIGA'S READING ROOM</text>
  <text x="1124" y="583" fill="#667372" font-family="Yu Gothic, Meiryo, sans-serif" font-size="14" text-anchor="end">東方二次創作小説のご案内</text>
</svg>
