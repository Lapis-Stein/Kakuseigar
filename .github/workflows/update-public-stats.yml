name: Update public statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'

# Activate only after the production collection date, GA4 dimensions and
# read-only Google authentication have been configured. No credentials file or
# full analytics report is published; export-public-stats emits an allowlist.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.PUBLIC_STATS_ENABLED == 'true' &&
      vars.GA4_PROPERTY_ID != '' &&
      vars.GA4_COLLECTION_STARTED_ON != '' &&
      vars.GCP_WIF_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
      id-token: write
    steps:
      - name: Check out the production branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate public data
        run: node scripts/check.mjs
      - name: Run tests
        run: node --test
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Obtain a short-lived read-only token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/analytics.readonly
          access_token_lifetime: 300s
          create_credentials_file: false
          export_environment_variables: false
      - name: Export only the public counts
        run: node scripts/export-public-stats.mjs
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GA4_PROPERTY_ID: ${{ vars.GA4_PROPERTY_ID }}
          GA4_COLLECTION_STARTED_ON: ${{ vars.GA4_COLLECTION_STARTED_ON }}
      - name: Build the static site
        run: node scripts/build.mjs
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the complete snapshot
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
